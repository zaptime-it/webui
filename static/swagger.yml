---
openapi: 3.0.3
info:
  title: BTClock API
  version: '3.4.0'
  description: |
    BTClock V3 HTTP API as implemented by the firmware `src/lib/net/webserver/` module.
    REST routes are under `/api/...`; SSE lives at `/events`; OTA uploads use `/upload/...`.
    The embedded WebUI may rewrite `/api` to `/` for same-origin routing.

    ## 3.4.0 breaking changes

    - State-changing routes moved from `GET` to `POST`. The legacy `GET`
      forms (e.g. `GET /api/identify`, `GET /api/restart`,
      `GET /api/action/pause`, `GET /api/full_refresh`,
      `GET /api/show/*`, `GET /api/lights/*`, `GET /api/frontlight/*`) are
      no longer registered.
    - Settings writes moved from `PATCH /api/json/settings` to
      `PATCH /api/settings`. The old URL is gone.
    - `POST /api/show/custom` and `POST /api/lights/set` are POST-only;
      the firmware no longer accepts PATCH on those routes.
    - The `customEndpoint` settings key is retired — use `ceEndpoint`
      instead (there is no migration shim).
    - `GET /api/settings` no longer returns plaintext passwords; see the
      `Settings` schema for the `httpAuthPassSet` / `otaPassSet`
      booleans.

    ## Validation errors

    `PATCH /api/settings` returns `400 Bad Request` with a JSON body
    `{ "error": "<field>:<reason>" }` when a value fails validation —
    see the response definition on that endpoint for the full
    vocabulary. The WebUI's `parseSettingsError` helper splits this
    into `{ field, reason }` so the offending input can be highlighted
    and scrolled into view.

    ## Auth

    When the device has `httpAuthEnabled = true`, *every* endpoint on this
    spec requires HTTP Basic auth, including the SSE stream and read-only
    status endpoints. When it is false (the factory default), no endpoint
    requires auth. The auth contract is the same on all routes so it is
    only called out explicitly here rather than duplicated per-path.
servers:
  - url: '/'
paths:
  '/api/status':
    get:
      tags: [system]
      summary: Get current runtime status
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Status' }
        '401':
          description: Authentication required
  '/api/system_status':
    get:
      tags: [system]
      summary: Get memory, filesystem, and WiFi metrics
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/SystemStatus' }
        '401':
          description: Authentication required
  '/api/settings':
    get:
      tags: [settings]
      summary: Get current settings
      description: |
        Returns the full settings document. Password fields are NEVER included in the response;
        instead, `httpAuthPassSet` and `otaPassSet` booleans indicate whether one is currently stored.
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Settings' }
        '401':
          description: Authentication required
    patch:
      tags: [settings]
      summary: Apply partial settings update
      description: |
        Send a JSON object with only the keys to change. Updatable keys include all `Settings`
        preference fields, the `screens` array, `actCurrencies`, the nested `dnd` block,
        `timePerScreen` (minutes, stored as `timerSeconds`), `tzOffset` (minutes, stored as
        `gmtOffset` seconds), `txPower`, `dataSource`, etc.

        To set a password, include `httpAuthPass` / `otaPass` as a non-empty string.
        To clear a stored password, send an empty string. Omit the key entirely to leave
        the stored value unchanged — this is what clients should do when they are
        round-tripping a full settings form.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: |
            Settings accepted. Body is empty when no boot-only fields were
            touched, otherwise `{ "rebootRequired": true }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rebootRequired: { type: boolean, example: true }
        '400':
          description: |
            Validation failed. The body carries a single `error` string of
            the form `<field>:<reason>` (e.g. `fontName:unknown`,
            `timerSeconds:bad_type`, `screens:dup_id`) — or, for the
            inverted numeric out-of-range form, `range:<field>`. The
            WebUI's `parseSettingsError` helper splits the two halves so
            it can highlight the offending input.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: fontName:unknown
        '401':
          description: Authentication required
  '/api/wifi_set_tx_power':
    post:
      tags: [network]
      summary: Set WiFi TX power (dBm enum value)
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: txPower
          required: true
          schema: { type: integer }
          description: ESP32 `wifi_power_t` value (e.g. 78 for 19.5 dBm).
      responses:
        '200':
          description: Power applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  setTxPower: { type: string, example: ok }
        '400':
          description: Missing or invalid txPower
  '/api/stop_datasources':
    post:
      tags: [datasources]
      summary: Stop price and block data connections
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/restart_datasources':
    post:
      tags: [datasources]
      summary: Restart data connections according to current data source mode
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/action/pause':
    post:
      tags: [timer]
      summary: Pause screen rotation timer
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/action/timer_restart':
    post:
      tags: [timer]
      summary: Resume screen rotation timer
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/show/screen':
    post:
      tags: [screens]
      summary: Switch to a screen by index
      description: |
        The firmware also registers the rewrite `/api/show/screen/{s}` → this URL. Prefer the
        query-parameter form.
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: s
          required: true
          schema: { type: integer }
          description: Screen index (0 … numScreens-1)
      responses:
        '200': { description: successful operation }
  '/api/show/text':
    post:
      tags: [screens]
      summary: Show one character per display (legacy text mode)
      description: |
        The firmware also registers rewrites `/api/show/text/{text}` and
        `/api/show/number/{number}` → this URL. Text is uppercased on the device.
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: t
          required: true
          schema: { type: string }
      responses:
        '200': { description: successful operation }
  '/api/show/currency':
    post:
      tags: [screens]
      summary: Switch to an active fiat/crypto currency code
      description: |
        The firmware also registers `/api/show/currency/{c}` → this URL.
        Returns 404 if the currency is not in `actCurrencies`.
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: c
          required: true
          schema: { type: string }
      responses:
        '200': { description: successful operation }
        '404': { description: Currency not in active list }
  '/api/screen/next':
    post:
      tags: [screens]
      summary: Advance to next screen in rotation order
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/screen/previous':
    post:
      tags: [screens]
      summary: Go to previous screen in rotation order
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/show/custom':
    post:
      tags: [screens]
      summary: Set custom multi-line EPD content (JSON array)
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomText' }
      responses:
        '200': { description: successful operation }
  '/api/full_refresh':
    post:
      tags: [system]
      summary: Force full refresh of all EPD panels
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/lights':
    get:
      tags: [lights]
      summary: Get LED strip colors
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: JSON array of per-LED RGB values
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ArrayOfLeds' }
  '/api/lights/set':
    post:
      tags: [lights]
      summary: Set each LED from a JSON array
      description: Empty array turns all LEDs off. Array length must equal the device's LED count.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ArrayOfLedsInput' }
      responses:
        '200': { description: successful operation }
        '400': { description: Invalid colors, wrong LED count, or malformed JSON }
  '/api/lights/color':
    post:
      tags: [lights]
      summary: Set all LEDs to one RGB hex color
      description: |
        The firmware also registers the rewrite `/api/lights/color/{color}` → this URL.
        Use six hex digits without `#`, or `off`.
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: c
          required: true
          schema: { type: string, example: FFCC00 }
      responses:
        '200':
          description: Returns current LED array (same shape as GET /api/lights)
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ArrayOfLeds' }
        '400': { description: Missing color parameter }
  '/api/lights/off':
    post:
      tags: [lights]
      summary: Turn all LEDs off
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/identify':
    post:
      tags: [system]
      summary: Flash LEDs with identify pattern
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/restart':
    post:
      tags: [system]
      summary: Restart the device
      description: Response is flushed before the reboot; the connection will then close.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/dnd/status':
    get:
      tags: [dnd]
      summary: Get Do-Not-Disturb status
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/DndStatusApi' }
  '/api/dnd/enable':
    post:
      tags: [dnd]
      summary: Enable manual DND override
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/dnd/disable':
    post:
      tags: [dnd]
      summary: Disable manual DND override
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/firmware/auto_update':
    post:
      tags: [firmware]
      summary: Trigger OTA firmware check / update (only when OTA is enabled)
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: Update queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
        '503':
          description: Update already in progress
  '/upload/firmware':
    post:
      tags: [firmware]
      summary: Upload a firmware binary (multipart)
      description: |
        Streams the multipart body directly to `Update.write()` with on-the-fly SHA-256.
        Available when OTA is enabled.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: Upload finished; connection may close before reboot }
  '/upload/webui':
    post:
      tags: [firmware]
      summary: Upload WebUI / LittleFS image (multipart)
      description: Available when OTA is enabled.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/on':
    post:
      tags: [frontlight]
      summary: Fade frontlight on (Rev B + frontlight hardware only)
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/off':
    post:
      tags: [frontlight]
      summary: Fade frontlight off
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/flash':
    post:
      tags: [frontlight]
      summary: Run frontlight flash effect
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/status':
    get:
      tags: [frontlight]
      summary: Frontlight levels per screen
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  flStatus:
                    type: array
                    items: { type: integer }
  '/api/frontlight/brightness':
    post:
      tags: [frontlight]
      summary: Set frontlight brightness
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: b
          required: true
          schema: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '200': { description: successful operation }
        '400': { description: Missing parameter }
  '/events':
    get:
      tags: [system]
      summary: Server-Sent Events stream of status updates
      description: |
        Event stream for live status updates. The firmware emits three
        kinds of frames over the wire:

        - `event: welcome` — sent once on connect; payload is the
          stringified IP address of the client.
        - `event: status` — payload JSON matches `GET /api/status`
          (shares `buildStatusJson()`). One frame is pushed on every
          state change (block height update, screen rotation, LED
          colour change, DND transition, etc.).
        - `data: closing` (no `event:` prefix, default `message`
          listener) — sent immediately before the firmware closes the
          connection cleanly (e.g. when the LFS image is being swapped
          during an OTA finalisation). Clients should reconnect after
          a short delay; this is a graceful handoff, not a failure.

        Reconnect strategy: 1 s on first `error`, doubling to a 30 s
        cap (see `src/lib/api/sse.ts::computeBackoffMs` in the WebUI),
        and 5 s after a `closing` message. The "lost connection"
        overlay reads its label from `statusStore.otaInProgress` so
        users see "Updating firmware…" during an OTA reconnect.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: text/event-stream }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ConnectionStatus:
      type: object
      properties:
        price: { type: boolean }
        blocks: { type: boolean }
        V2: { type: boolean }
        nostr: { type: boolean }
    DndNestedStatus:
      type: object
      description: DND block embedded in `GET /api/status` and SSE payload
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startTime: { type: string, example: '22:30' }
        endTime: { type: string, example: '07:00' }
        active: { type: boolean }
    DndStatusApi:
      type: object
      description: Response of `GET /api/dnd/status`
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startTime: { type: string }
        endTime: { type: string }
        active: { type: boolean }
    Status:
      type: object
      description: Response of `GET /api/status` (same builder as SSE `status` events).
      properties:
        currentScreen: { type: integer }
        numScreens: { type: integer }
        timerRunning: { type: boolean }
        isOTAUpdating: { type: boolean }
        espUptime: { type: integer, format: int64 }
        espFreeHeap: { type: integer }
        espHeapSize: { type: integer }
        connectionStatus: { '$ref': '#/components/schemas/ConnectionStatus' }
        rssi: { type: integer }
        currency: { type: string }
        data:
          type: array
          description: Current text/line per EPD
          items: { type: string }
        leds: { '$ref': '#/components/schemas/ArrayOfLeds' }
        dnd: { '$ref': '#/components/schemas/DndNestedStatus' }
        flStatus:
          type: array
          items: { type: integer }
          description: Present when hardware has frontlight support.
        lightLevel:
          type: integer
          description: Present when ambient light sensor is available.
    SystemStatus:
      type: object
      properties:
        espFreeHeap: { type: integer }
        espHeapSize: { type: integer }
        espFreePsram: { type: integer }
        espPsramSize: { type: integer }
        fsUsedBytes: { type: integer, format: int64 }
        fsTotalBytes: { type: integer, format: int64 }
        rssi: { type: integer }
        txPower: { type: integer }
    Screen:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
    DndSettings:
      type: object
      description: Nested object on `GET /api/settings` and allowed inside `PATCH` body
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startHour: { type: integer, minimum: 0, maximum: 23 }
        startMinute: { type: integer, minimum: 0, maximum: 59 }
        endHour: { type: integer, minimum: 0, maximum: 23 }
        endMinute: { type: integer, minimum: 0, maximum: 59 }
    Settings:
      type: object
      description: |
        Full document returned by `GET /api/settings`. Exact optional fields depend on firmware
        build (e.g. `hasFrontlight`, `gitRev`). Matches the WebUI `Settings` TypeScript type.

        Passwords are NEVER returned. The `httpAuthPassSet` and `otaPassSet` booleans indicate
        whether one is currently stored; to change them, PATCH the corresponding write-only
        keys (`httpAuthPass`, `otaPass`) on `/api/settings`.
      properties:
        numScreens: { type: integer }
        invertedColor: { type: boolean }
        timerSeconds: { type: integer }
        timerRunning: { type: boolean }
        minSecPriceUpd: { type: integer }
        fullRefreshMin: { type: integer }
        wpTimeout: { type: integer }
        tzString: { type: string }
        dataSource:
          type: integer
          description: |
            0 BTCLOCK_SOURCE, 1 THIRD_PARTY_SOURCE, 2 NOSTR_SOURCE, 3 CUSTOM_SOURCE
          enum: [0, 1, 2, 3]
        mempoolInstance: { type: string }
        mempoolSecure: { type: boolean }
        localPoolHost: { type: string }
        nostrPubKey: { type: string }
        nostrRelay: { type: string }
        nostrZapNotify: { type: boolean }
        nostrZapPubkey: { type: string }
        ledFlashOnZap: { type: boolean }
        scrnRestoreZap: { type: boolean }
        fontName: { type: string }
        availableFonts:
          type: array
          items: { type: string }
        ledTestOnPower: { type: boolean }
        ledFlashOnUpd: { type: boolean }
        ledBrightness: { type: integer }
        stealFocus: { type: boolean }
        mcapBigChar: { type: boolean }
        mdnsEnabled: { type: boolean }
        otaEnabled: { type: boolean }
        otaPassSet:
          type: boolean
          readOnly: true
          description: True when the device has a non-empty ArduinoOTA password stored.
        useSatsSymbol: { type: boolean }
        useBlkCountdown: { type: boolean }
        suffixPrice: { type: boolean }
        disableLeds: { type: boolean }
        mowMode: { type: boolean }
        verticalDesc: { type: boolean }
        blockFeeDec: { type: boolean }
        blockFlashColor: { type: integer }
        supplyPercent: { type: boolean }
        refrScrnChange: { type: boolean }
        inverseButtons: { type: boolean }
        suffixShareDot: { type: boolean }
        enableDebugLog: { type: boolean }
        hostnamePrefix: { type: string }
        hostname: { type: string }
        ip: { type: string }
        txPower: { type: integer }
        gitReleaseUrl: { type: string }
        bitaxeEnabled: { type: boolean }
        bitaxeHostname: { type: string }
        miningPoolStats: { type: boolean }
        miningPoolName: { type: string }
        miningPoolUser: { type: string }
        availablePools:
          type: array
          items: { type: string }
        httpAuthEnabled: { type: boolean }
        httpAuthUser: { type: string }
        httpAuthPassSet:
          type: boolean
          readOnly: true
          description: True when the device has a non-empty WebUI auth password stored.
        hasFrontlight: { type: boolean }
        flDisable: { type: boolean }
        flMaxBrightness: { type: integer }
        flAlwaysOn: { type: boolean }
        flEffectDelay: { type: integer }
        flFlashOnUpd: { type: boolean }
        flFlashOnZap: { type: boolean }
        hasLightLevel: { type: boolean }
        luxLightToggle: { type: integer }
        flOffWhenDark: { type: boolean }
        hwRev: { type: string }
        fsRev: { type: string }
        gitRev: { type: string }
        gitTag: { type: string }
        lastBuildTime: { type: string }
        screens:
          type: array
          items: { '$ref': '#/components/schemas/Screen' }
        actCurrencies:
          type: array
          items: { type: string }
        availableCurrencies:
          type: array
          items: { type: string }
        poolLogosUrl: { type: string }
        ceEndpoint: { type: string }
        ceDisableSSL: { type: boolean }
        dnd: { '$ref': '#/components/schemas/DndSettings' }
    SettingsPatch:
      description: |
        Partial settings document; omit keys you do not want to change. Keys mirror `Settings`
        and `onApiSettingsPatch` in firmware. The two password fields below are write-only;
        GET /api/settings does not return them.
      type: object
      allOf:
        - '$ref': '#/components/schemas/Settings'
        - type: object
          properties:
            httpAuthPass:
              type: string
              writeOnly: true
              description: |
                Set a WebUI password (non-empty) or clear it (empty string). Omit to leave unchanged.
            otaPass:
              type: string
              writeOnly: true
              description: |
                Set an ArduinoOTA password (non-empty) or clear it (empty string). Omit to leave unchanged.
    RgbColorValues:
      type: object
      properties:
        red: { type: integer, minimum: 0, maximum: 255, example: 255 }
        green: { type: integer, minimum: 0, maximum: 255, example: 204 }
        blue: { type: integer, minimum: 0, maximum: 255, example: 0 }
    RgbColorHex:
      type: object
      properties:
        hex:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
          example: '#FFCC00'
    RgbColorValueAndHex:
      allOf:
        - '$ref': '#/components/schemas/RgbColorValues'
        - '$ref': '#/components/schemas/RgbColorHex'
    RgbColorValueOrHex:
      oneOf:
        - '$ref': '#/components/schemas/RgbColorValues'
        - '$ref': '#/components/schemas/RgbColorHex'
    ArrayOfLeds:
      type: array
      items: { '$ref': '#/components/schemas/RgbColorValueAndHex' }
    ArrayOfLedsInput:
      type: array
      items: { '$ref': '#/components/schemas/RgbColorValueOrHex' }
    CustomText:
      type: array
      description: One string per screen; length must match device `numScreens` (commonly 7 or 8).
      minItems: 1
      items: { type: string }
