---
openapi: 3.2.0
info:
  title: BTClock API
  version: '4.0.0'
  description: |
    BTClock HTTP API as implemented by the firmware `src/lib/net/webserver/` module.
    REST routes are under `/api/...`; SSE lives at `/events`; OTA uploads use `/upload/...`.
    The embedded WebUI may rewrite `/api` to `/` for same-origin routing.

    ## Validation errors

    `PATCH /api/settings` returns `400 Bad Request` with a JSON body
    `{ "error": "<field>:<reason>" }` when a value fails validation —
    see the response definition on that endpoint for the full
    vocabulary. The WebUI's `parseSettingsError` helper splits this
    into `{ field, reason }` so the offending input can be highlighted
    and scrolled into view.

    ## Auth

    When the device has `httpAuthEnabled = true`, *every* endpoint on this
    spec requires HTTP Basic auth, including the SSE stream and read-only
    status endpoints. When it is false (the factory default), no endpoint
    requires auth. The auth contract is the same on all routes so it is
    only called out explicitly here rather than duplicated per-path.
servers:
  - url: '/'
paths:
  '/api/status':
    get:
      tags: [system]
      summary: Get current runtime status
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Status' }
        '401':
          description: Authentication required
  '/api/system_status':
    get:
      tags: [system]
      summary: Get memory, filesystem, and WiFi metrics
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/SystemStatus' }
        '401':
          description: Authentication required
  '/api/settings':
    get:
      tags: [settings]
      summary: Get current settings
      description: |
        Returns the full settings document. Password fields are NEVER included in the response;
        instead, `httpAuthPassSet` and `otaPassSet` booleans indicate whether one is currently stored.
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/Settings' }
        '401':
          description: Authentication required
    patch:
      tags: [settings]
      summary: Apply partial settings update
      description: |
        Send a JSON object with only the keys to change. Updatable keys include all `Settings`
        preference fields, the `screens` array, `actCurrencies`, the nested `dnd` block,
        `timePerScreen` (minutes, stored as `timerSeconds`), `tzOffset` (minutes, stored as
        `gmtOffset` seconds), `txPower`, `dataSource`, etc.

        To set a password, include `httpAuthPass` / `otaPass` as a non-empty string.
        To clear a stored password, send an empty string. Omit the key entirely to leave
        the stored value unchanged — this is what clients should do when they are
        round-tripping a full settings form.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/SettingsPatch' }
      responses:
        '200':
          description: |
            Settings accepted. Body is empty when no boot-only fields were
            touched, otherwise `{ "rebootRequired": true }`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rebootRequired: { type: boolean, example: true }
        '400':
          description: |
            Validation failed. The body carries a single `error` string of
            the form `<field>:<reason>` (e.g. `fontName:unknown`,
            `timerSeconds:bad_type`, `screens:dup_id`) — or, for the
            inverted numeric out-of-range form, `range:<field>`. The
            WebUI's `parseSettingsError` helper splits the two halves so
            it can highlight the offending input.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                    example: fontName:unknown
        '401':
          description: Authentication required
  '/api/wifi_set_tx_power':
    post:
      tags: [network]
      summary: Set WiFi TX power (dBm enum value)
      security: [{ basicAuth: [] }]
      parameters:
        - in: query
          name: txPower
          required: true
          schema: { type: integer }
          description: ESP32 `wifi_power_t` value (e.g. 78 for 19.5 dBm).
      responses:
        '200':
          description: Power applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  setTxPower: { type: string, example: ok }
        '400':
          description: Missing or invalid txPower
  '/api/stop_datasources':
    post:
      tags: [datasources]
      summary: Stop price and block data connections
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/restart_datasources':
    post:
      tags: [datasources]
      summary: Restart data connections according to current data source mode
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/action/pause':
    post:
      tags: [timer]
      summary: Pause screen rotation timer
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/action/timer_restart':
    post:
      tags: [timer]
      summary: Resume screen rotation timer
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/show/screen':
    post:
      tags: [screens]
      summary: Switch to a screen by index
      description: |
        POST body carries the selected screen id as JSON: `{ "s": <id> }`.
        The firmware also accepts the legacy query form for backward compatibility.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [s]
              properties:
                s:
                  type: integer
                  description: Screen index (api id from `settings.screens[].id`)
      responses:
        '200': { description: successful operation }
  '/api/show/text':
    post:
      tags: [screens]
      summary: Show one character per display (legacy text mode)
      description: |
        POST body carries text as JSON: `{ "t": "HELLO" }`.
        Text is uppercased and split one character per panel on the device.
        Legacy query/rewritten forms are still accepted for compatibility.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [t]
              properties:
                t: { type: string }
      responses:
        '200': { description: successful operation }
  '/api/show/currency':
    post:
      tags: [screens]
      summary: Switch to an active fiat/crypto currency code
      description: |
        POST body carries the currency code as JSON: `{ "c": "USD" }`.
        Returns 404 if the currency is not in `actCurrencies`.
        Legacy query/rewritten forms are still accepted for compatibility.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [c]
              properties:
                c: { type: string }
      responses:
        '200': { description: successful operation }
        '404': { description: Currency not in active list }
  '/api/screen/next':
    post:
      tags: [screens]
      summary: Advance to next screen in rotation order
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/screen/previous':
    post:
      tags: [screens]
      summary: Go to previous screen in rotation order
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/show/custom':
    post:
      tags: [screens]
      summary: Set custom multi-line EPD content (JSON array)
      description: |
        Each cell is normally rendered as text. Cells starting with `mdi:` (ASCII,
        case-insensitive) followed by a Material Design Icons **kebab-case** name
        from the firmware subset (same names as `tools/fonts/regen_mdi.sh`) paint
        that icon centered via the icon font instead of digit text. Unknown names
        leave the panel blank. A `/` in the icon token opts out so split-text
        cells keep working.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/CustomText' }
      responses:
        '200': { description: successful operation }
  '/api/full_refresh':
    post:
      tags: [system]
      summary: Force full refresh of all EPD panels
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/lights':
    get:
      tags: [lights]
      summary: Get LED strip colors
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: JSON array of per-LED RGB values
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ArrayOfLeds' }
  '/api/lights/set':
    post:
      tags: [lights]
      summary: Set each LED from a JSON array
      description: Empty array turns all LEDs off. Array length must equal the device's LED count.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { '$ref': '#/components/schemas/ArrayOfLedsInput' }
      responses:
        '200': { description: successful operation }
        '400': { description: Invalid colors, wrong LED count, or malformed JSON }
  '/api/lights/color':
    post:
      tags: [lights]
      summary: Set all LEDs to one RGB hex color
      description: |
        POST body carries color as JSON: `{ "c": "FFCC00" }` or `{ "c": "off" }`.
        Legacy query/rewritten forms are still accepted for compatibility.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [c]
              properties:
                c: { type: string, example: FFCC00 }
      responses:
        '200':
          description: Returns current LED array (same shape as GET /api/lights)
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/ArrayOfLeds' }
        '400': { description: Missing color parameter }
  '/api/lights/off':
    post:
      tags: [lights]
      summary: Turn all LEDs off
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/lights/effect':
    post:
      tags: [lights]
      summary: Trigger a named LED effect
      description: |
        Queues a named effect onto the existing LED worker. Unknown JSON
        keys are silently ignored so future fields (`color`, `count`,
        `duration_ms`, …) can be added without breaking existing
        clients. DND, `disableLeds`, and the global suppressor still
        gate the effect inside the LED controller.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: |
                    Lower-snake effect name. Maps internally to a
                    `LedEffect` enum value.
                  enum:
                    - blink
                    - blink_success
                    - blink_error
                    - rainbow
                    - breathe
                    - breathe_error
                    - zap
                    - identify
                    - heartbeat
                    - off
                    - idle
              example: { name: rainbow }
      responses:
        '200':
          description: Effect queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean, example: true }
                  name: { type: string, example: rainbow }
        '400':
          description: |
            Malformed body, missing `name`, or unknown effect name.
            Body is `{ "error": "unknown effect" }` (or a similar
            single-string `error` field).
  '/api/identify':
    post:
      tags: [system]
      summary: Flash LEDs with identify pattern
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/restart':
    post:
      tags: [system]
      summary: Restart the device
      description: Response is flushed before the reboot; the connection will then close.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/dnd/status':
    get:
      tags: [dnd]
      summary: Get Do-Not-Disturb status
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema: { '$ref': '#/components/schemas/DndStatusApi' }
  '/api/dnd/enable':
    post:
      tags: [dnd]
      summary: Enable manual DND override
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/dnd/disable':
    post:
      tags: [dnd]
      summary: Disable manual DND override
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/firmware/auto_update':
    post:
      tags: [firmware]
      summary: Trigger OTA firmware check / update (only when OTA is enabled)
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: Update queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg: { type: string }
        '503':
          description: Update already in progress
  '/upload/firmware':
    post:
      tags: [firmware]
      summary: Upload a firmware binary (multipart)
      description: |
        Streams the multipart body directly to `Update.write()` with on-the-fly SHA-256.
        Available when OTA is enabled.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: Upload finished; connection may close before reboot }
  '/upload/webui':
    post:
      tags: [firmware]
      summary: Upload WebUI / LittleFS image (multipart)
      description: Available when OTA is enabled.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/on':
    post:
      tags: [frontlight]
      summary: Fade frontlight on (Rev B + frontlight hardware only)
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/off':
    post:
      tags: [frontlight]
      summary: Fade frontlight off
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/flash':
    post:
      tags: [frontlight]
      summary: Run frontlight flash effect
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: successful operation }
  '/api/frontlight/status':
    get:
      tags: [frontlight]
      summary: Frontlight levels per screen
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  flStatus:
                    type: array
                    items: { type: integer }
  '/api/frontlight/brightness':
    post:
      tags: [frontlight]
      summary: Set frontlight brightness
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [b]
              properties:
                b: { type: integer, minimum: 0, maximum: 65535 }
      responses:
        '200': { description: successful operation }
        '400': { description: Missing parameter }
  '/api/frontlight/set':
    post:
      tags: [frontlight]
      summary: Set per-channel frontlight duties (manual override)
      description: |
        Body is a flat JSON array of 12-bit duty values (0..4095), one
        entry per panel-backlight channel. Length must equal `numScreens`
        (or be empty to clear all channels to 0). Bypasses the DND gate
        and the always-on / lux fader so a debug pattern (e.g. zebra)
        persists until any subsequent block-flash, ambient transition,
        or brightness PATCH resumes uniform fader control.
      security: [{ basicAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, minimum: 0, maximum: 4095 }
            example: [2048, 0, 2048, 0, 2048, 0, 2048]
      responses:
        '200': { description: successful operation }
        '400': { description: bad json / channel count mismatch / out of range }
        '503': { description: frontlight not present on this board }
  '/events':
    get:
      tags: [system]
      summary: Server-Sent Events stream of status updates
      description: |
        Event stream for live status updates. The firmware emits three
        kinds of frames over the wire:

        - `event: welcome` — sent once on connect; payload is the
          stringified IP address of the client.
        - `event: status` — payload JSON matches `GET /api/status`
          (shares `buildStatusJson()`). One frame is pushed on every
          state change (block height update, screen rotation, LED
          colour change, DND transition, etc.).
        - `data: closing` (no `event:` prefix, default `message`
          listener) — sent immediately before the firmware closes the
          connection cleanly (e.g. when the LFS image is being swapped
          during an OTA finalisation). Clients should reconnect after
          a short delay; this is a graceful handoff, not a failure.

        Reconnect strategy: 1 s on first `error`, doubling to a 30 s
        cap (see `src/lib/api/sse.ts::computeBackoffMs` in the WebUI),
        and 5 s after a `closing` message. The "lost connection"
        overlay reads its label from `statusStore.otaInProgress` so
        users see "Updating firmware…" during an OTA reconnect.
      security: [{ basicAuth: [] }]
      responses:
        '200': { description: text/event-stream }
  '/api/diag/heap_trace/start':
    post:
      tags: [diag]
      summary: Begin a leak-mode heap_trace window (dev builds only)
      description: |
        Routes through `heap_trace_init_standalone` +
        `heap_trace_start(HEAP_TRACE_LEAKS)`. Endpoint is compiled out
        unless the firmware is built with
        `CONFIG_HEAP_TRACING_STANDALONE=y` — currently only the Rev A
        build ships it. On builds without the option the route returns
        404.

        Calling `start` while a window is already armed will reset the
        capture buffer. Optional JSON body `{ "cap": N }` chooses the
        record capacity (1..4096).
      security: [{ basicAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cap:
                  type: integer
                  minimum: 1
                  maximum: 4096
      responses:
        '200':
          description: Trace started
          content:
            application/json:
              schema:
                type: object
                properties:
                  started: { type: boolean, example: true }
                  capacity:
                    type: integer
                    description: Number of leak-record slots in the trace buffer.
                    example: 256
                  depth:
                    type: integer
                    description: Per-record stack depth (`CONFIG_HEAP_TRACING_STACK_DEPTH`).
                    example: 4
        '404': { description: Endpoint not compiled in (CONFIG_HEAP_TRACING_STANDALONE=n) }
        '409': { description: Trace could not be started (heap_trace_start returned non-OK) }
  '/api/diag/heap_trace/stop':
    post:
      tags: [diag]
      summary: Stop the active heap_trace window and dump live leaks
      description: |
        Stops the trace and returns the still-live records as JSON. Each
        record is a single allocation that was not freed before this
        call. Resolve `pcs[]` with
        `xtensa-esp32s3-elf-addr2line -e <build>/btclock_v4.elf -f -p`.

        See `docs/diag/heap_trace_2026-05-04/` in the firmware repo for
        an example pair of dumps and a symbol-resolution sidecar.
      security: [{ basicAuth: [] }]
      responses:
        '200':
          description: Trace stopped, leak records returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of leak records returned.
                  capacity:
                    type: integer
                    description: Buffer capacity at the time of the trace.
                  leaks:
                    type: array
                    items:
                      type: object
                      properties:
                        sz: { type: integer, description: Allocation size in bytes }
                        addr: { type: string, description: Heap address (hex string) }
                        cc: { type: integer, description: ccount cycle counter at alloc time }
                        pcs:
                          type: array
                          items: { type: string, description: Program counter (hex string) }
                          description: |
                            Stack frames of the allocation, deepest first.
                            Length up to `CONFIG_HEAP_TRACING_STACK_DEPTH`.
        '404': { description: Endpoint not compiled in (CONFIG_HEAP_TRACING_STANDALONE=n) }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    ConnectionStatus:
      type: object
      properties:
        price: { type: boolean }
        blocks: { type: boolean }
        V2: { type: boolean }
        nostr:
          type: array
          description: |
            Per-relay Nostr connection state, one entry per configured
            relay (firmware ≥ 4.0.0-rc.4). The array's order matches
            `settings.nostrRelays`. Empty when no Nostr feature is wired
            (`dataSource != 2` AND `nostrZapNotify` off, or every relay
            URL was rejected at boot). Pre-rc.4 firmware emitted this
            field as a single boolean — clients should feature-detect
            on `Array.isArray()`.
          items: { '$ref': '#/components/schemas/NostrRelayStatus' }
        nwc:
          type: boolean
          description: |
            Live NIP-47 Nostr Wallet Connect state. `true` while
            `settings.nwcEnabled` is on, the boot-wired NwcClient exists,
            and the relay WebSocket has reached `kReady`. Suppressed
            entirely on builds where NWC is not wired (the field is
            absent, not `false`), so clients should feature-detect with
            `'nwc' in connectionStatus`.
    NostrRelayStatus:
      type: object
      description: One relay's live WebSocket state (in `connectionStatus.nostr`).
      required: [url, connected]
      properties:
        url:
          type: string
          example: 'wss://relay.primal.net'
        connected:
          type: boolean
          description: True while the WSS handshake is up and the relay is reachable.
    DndNestedStatus:
      type: object
      description: DND block embedded in `GET /api/status` and SSE payload
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startTime: { type: string, example: '22:30' }
        endTime: { type: string, example: '07:00' }
        active: { type: boolean }
    DndStatusApi:
      type: object
      description: Response of `GET /api/dnd/status`
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startTime: { type: string }
        endTime: { type: string }
        active: { type: boolean }
    Status:
      type: object
      description: Response of `GET /api/status` (same builder as SSE `status` events).
      properties:
        currentScreen: { type: integer }
        numScreens: { type: integer }
        timerRunning: { type: boolean }
        isOTAUpdating: { type: boolean }
        espUptime: { type: integer, format: int64 }
        espFreeHeap: { type: integer }
        espHeapSize: { type: integer }
        connectionStatus: { '$ref': '#/components/schemas/ConnectionStatus' }
        rssi: { type: integer }
        currency: { type: string }
        data:
          type: array
          description: Current text/line per EPD
          items: { type: string }
        leds: { '$ref': '#/components/schemas/ArrayOfLeds' }
        dnd: { '$ref': '#/components/schemas/DndNestedStatus' }
        frontlight:
          type: object
          description: Present when the board has frontlight hardware.
          properties:
            on:
              type: boolean
              description: True when at least one channel is non-zero.
            duties:
              type: array
              description: Per-channel current 12-bit duty (0..4095). One entry per panel.
              items: { type: integer, minimum: 0, maximum: 4095 }
            targetDuty:
              type: integer
              description: Where the global fader is heading (single-value approximation).
            configuredBrightness:
              type: integer
              description: User's "on" brightness preference (`flMaxBrightness`).
        lightLevel:
          type: integer
          description: Present when ambient light sensor is available.
    SystemStatus:
      type: object
      properties:
        espFreeHeap: { type: integer }
        espHeapSize: { type: integer }
        espFreePsram: { type: integer }
        espPsramSize: { type: integer }
        fsUsedBytes: { type: integer, format: int64 }
        fsTotalBytes: { type: integer, format: int64 }
        rssi: { type: integer }
        txPower: { type: integer }
    Screen:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        enabled: { type: boolean }
    DndSettings:
      type: object
      description: Nested object on `GET /api/settings` and allowed inside `PATCH` body
      properties:
        enabled: { type: boolean }
        dndTimeEnabled: { type: boolean }
        startHour: { type: integer, minimum: 0, maximum: 23 }
        startMinute: { type: integer, minimum: 0, maximum: 59 }
        endHour: { type: integer, minimum: 0, maximum: 23 }
        endMinute: { type: integer, minimum: 0, maximum: 59 }
    Settings:
      type: object
      description: |
        Full document returned by `GET /api/settings`. Exact optional fields depend on firmware
        build (e.g. `hasFrontlight`, `gitRev`). Matches the WebUI `Settings` TypeScript type.

        Passwords are NEVER returned. The `httpAuthPassSet` and `otaPassSet` booleans indicate
        whether one is currently stored; to change them, PATCH the corresponding write-only
        keys (`httpAuthPass`, `otaPass`) on `/api/settings`.
      properties:
        numScreens: { type: integer }
        invertedColor: { type: boolean }
        timerSeconds: { type: integer }
        timerRunning: { type: boolean }
        minSecPriceUpd: { type: integer }
        fullRefreshMin: { type: integer }
        wpTimeout: { type: integer }
        tzString: { type: string }
        dataSource:
          type: integer
          description: |
            0 BTCLOCK_SOURCE, 1 THIRD_PARTY_SOURCE, 2 NOSTR_SOURCE, 3 CUSTOM_SOURCE
          enum: [0, 1, 2, 3]
        mempoolInstance: { type: string }
        mempoolSecure: { type: boolean }
        localPoolHost: { type: string }
        nostrPubKey: { type: string }
        nostrRelay:
          type: string
          deprecated: true
          description: |
            Legacy single-relay slot. On `GET` this mirrors
            `nostrRelays[0]` for back-compat with pre-rc.4 clients; on
            `PATCH` a string write is bridged into a 1-element
            `nostrRelays`. New clients should read and write
            `nostrRelays` instead.
        nostrRelays:
          type: array
          description: |
            Configured Nostr relay URLs (firmware ≥ 4.0.0-rc.4). Each
            entry opens one WebSocket; the data source (when
            `dataSource=2`) and the zap listener (when `nostrZapNotify`
            is on) share a single WSS per relay via NIP-01 multi-sub.
            Boot-only — a `PATCH` returns `rebootRequired: true` and the
            new list takes effect on the next boot. Cap of 4 entries
            (validator returns `nostrRelays:too_many` past that).
            Bad-scheme entries return `nostrRelays:bad_scheme`.
          maxItems: 4
          items:
            type: string
            pattern: '^(wss|ws)://'
            example: 'wss://relay.primal.net'
        nostrZapNotify: { type: boolean }
        nostrZapPubkey:
          type: string
          deprecated: true
          description: |
            Legacy single-pubkey slot. On `GET` mirrors
            `nostrZapPubkeys[0]`; on `PATCH` a string write is bridged
            into a 1-element `nostrZapPubkeys`. New clients should read
            and write `nostrZapPubkeys` instead.
        nostrZapPubkeys:
          type: array
          description: |
            Zap-recipient pubkeys. The listener emits one NIP-01 REQ
            with `#p` matching every entry, so all recipients share one
            subscription per relay. Cap of 8 entries (validator returns
            `nostrZapPubkeys:too_many` past that). Each must be 64-char
            lowercase hex.
          maxItems: 8
          items:
            type: string
            minLength: 64
            maxLength: 64
            pattern: '^[0-9a-f]{64}$'
        ledFlashOnZap: { type: boolean }
        scrnRestoreZap: { type: boolean }
        nwcEnabled:
          type: boolean
          description: |
            Master toggle for Nostr Wallet Connect (NIP-47). When
            `true`, the firmware constructs a dedicated NwcClient at
            boot and subscribes to `payment_received` /
            `payment_sent` notifications from the paired wallet.
            Boot-only — `PATCH` returns `rebootRequired: true`.
        nwcRefreshSecs:
          type: integer
          minimum: 15
          maximum: 3600
          description: |
            Cadence (seconds) for the periodic `get_balance` poll.
            Short enough for a near-live balance, long enough to not
            hammer the relay. Boot-only — the esp_timer is armed once
            at boot.
        nwcShowNotify:
          type: boolean
          description: |
            When `true` (default), an incoming payment notification
            pops the `RECV ↓` / `PAID ↑` on-screen overlay. When
            `false`, the overlay is suppressed entirely and the LED
            + frontlight pulse is bypassed, but the balance / snapshot
            mirror still updates so the (opt-in) balance screen stays
            current. Live — re-read per notification.
        nwcFlashOnPay:
          type: boolean
          description: |
            When the payment-notify overlay paints, also fire the
            LED ring + frontlight pulse used by the Nostr-zap flash.
            Subordinate to `nwcShowNotify`. Live.
        nwcUriSet:
          type: boolean
          readOnly: true
          description: |
            `true` iff the device has a non-empty `nwcUri` stored.
            The raw URI is never echoed on `GET` because it carries
            the client secret — write a new value via `PATCH` with
            `nwcUri`, or clear it by `PATCH`ing `nwcUri: ""`.
        nwcUriMasked:
          type: string
          readOnly: true
          description: |
            Short fingerprint of the stored NWC pairing URI — wallet-
            pubkey prefix + ellipsis-redacted `secret` and `lud16`,
            e.g.
            `nostr+walletconnect://51f1f43c…?relay=wss://relay.example.com&secret=…&lud16=sat…com`.
            Emitted only when the stored URI parses cleanly.
        fontName: { type: string }
        availableFonts:
          type: array
          description: |
            Bundled digit fonts. Each entry's `hasBtcSymbol` reflects whether that
            family's subset maps U+20BF (₿); the WebUI disables the ₿ price-marker
            option when the active `fontName` row has `hasBtcSymbol: false`.
          items:
            type: object
            required: [id, hasBtcSymbol]
            properties:
              id: { type: string }
              hasBtcSymbol: { type: boolean }
        ledTestOnPower: { type: boolean }
        ledFlashOnUpd: { type: boolean }
        ledBrightness: { type: integer }
        stealFocus: { type: boolean }
        mcapBigChar: { type: boolean }
        mdnsEnabled: { type: boolean }
        otaEnabled: { type: boolean }
        otaPassSet:
          type: boolean
          readOnly: true
          description: True when the device has a non-empty ArduinoOTA password stored.
        priceSymMode:
          type: integer
          minimum: 0
          maximum: 2
          description: |
            BTC price-row marker — 0 none, 1 Satoshi Symbol glyph (PUA font),
            2 bitcoin sign ₿ (digit font). Replaces legacy useSatsSymbol /
            useBtcSymbol (single source of truth).
        useBlkCountdown: { type: boolean }
        suffixPrice: { type: boolean }
        disableLeds: { type: boolean }
        mowMode: { type: boolean }
        verticalDesc: { type: boolean }
        blockFeeDec: { type: boolean }
        blockFlashColor: { type: integer }
        supplyPercent: { type: boolean }
        refrScrnChange: { type: boolean }
        inverseButtons: { type: boolean }
        decimalShareDot: { type: boolean }
        enableDebugLog: { type: boolean }
        hostnamePrefix: { type: string }
        hostname: { type: string }
        ip: { type: string }
        txPower: { type: integer }
        gitReleaseUrl: { type: string }
        bitaxeEnabled: { type: boolean }
        bitaxeHostname: { type: string }
        miningPoolStats: { type: boolean }
        miningPoolName: { type: string }
        miningPoolUser: { type: string }
        availablePools:
          type: array
          items: { type: string }
        httpAuthEnabled: { type: boolean }
        httpAuthUser: { type: string }
        httpAuthPassSet:
          type: boolean
          readOnly: true
          description: True when the device has a non-empty WebUI auth password stored.
        hasFrontlight: { type: boolean }
        flDisable: { type: boolean }
        flMaxBrightness: { type: integer }
        flAlwaysOn: { type: boolean }
        flEffectDelay: { type: integer }
        flFlashOnUpd: { type: boolean }
        flFlashOnZap: { type: boolean }
        hasLightLevel: { type: boolean }
        luxLightToggle: { type: integer }
        flOffWhenDark: { type: boolean }
        hwRev: { type: string }
        fsRev: { type: string }
        gitRev: { type: string }
        gitTag: { type: string }
        lastBuildTime: { type: string }
        screens:
          type: array
          items: { '$ref': '#/components/schemas/Screen' }
        actCurrencies:
          type: array
          items: { type: string }
        availableCurrencies:
          type: array
          items: { type: string }
        poolLogosUrl: { type: string }
        ceEndpoint: { type: string }
        ceDisableSSL: { type: boolean }
        dnd: { '$ref': '#/components/schemas/DndSettings' }
    SettingsPatch:
      description: |
        Partial settings document; omit keys you do not want to change. Keys mirror `Settings`
        and `onApiSettingsPatch` in firmware. The two password fields below are write-only;
        GET /api/settings does not return them.
      type: object
      allOf:
        - '$ref': '#/components/schemas/Settings'
        - type: object
          properties:
            httpAuthPass:
              type: string
              writeOnly: true
              description: |
                Set a WebUI password (non-empty) or clear it (empty string). Omit to leave unchanged.
            otaPass:
              type: string
              writeOnly: true
              description: |
                Set an ArduinoOTA password (non-empty) or clear it (empty string). Omit to leave unchanged.
            nwcUri:
              type: string
              writeOnly: true
              description: |
                Full `nostr+walletconnect://<wallet-pubkey>?relay=<wss>&secret=<hex>[&lud16=<addr>]`
                pairing URI from the wallet. PATCH-only — the raw
                value is never echoed on `GET`; `nwcUriSet` (bool) +
                `nwcUriMasked` (string) represent it on read.

                Reboot required — the NwcClient + dedicated relay
                socket are wired once at boot. PATCH `""` to clear
                the stored URI; pair this with `nwcEnabled: false` to
                fully disable NWC at next boot.
    RgbColorValues:
      type: object
      properties:
        red: { type: integer, minimum: 0, maximum: 255, example: 255 }
        green: { type: integer, minimum: 0, maximum: 255, example: 204 }
        blue: { type: integer, minimum: 0, maximum: 255, example: 0 }
    RgbColorHex:
      type: object
      properties:
        hex:
          type: string
          pattern: '^#(?:[0-9a-fA-F]{3}){1,2}$'
          example: '#FFCC00'
    RgbColorValueAndHex:
      allOf:
        - '$ref': '#/components/schemas/RgbColorValues'
        - '$ref': '#/components/schemas/RgbColorHex'
    RgbColorValueOrHex:
      oneOf:
        - '$ref': '#/components/schemas/RgbColorValues'
        - '$ref': '#/components/schemas/RgbColorHex'
    ArrayOfLeds:
      type: array
      items: { '$ref': '#/components/schemas/RgbColorValueAndHex' }
    ArrayOfLedsInput:
      type: array
      items: { '$ref': '#/components/schemas/RgbColorValueOrHex' }
    CustomText:
      type: array
      description: >
        One string per panel; length must match device `numScreens` (commonly 7 or 8).
        Use `mdi:<name>` for subset Material Design Icons (kebab-case), e.g. `mdi:wifi`,
        `mdi:bitcoin`, `mdi:clock-outline`.
      minItems: 1
      items: { type: string }
